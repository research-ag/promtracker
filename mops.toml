[package]
name = "promtracker"
version = "1.0.2"
description = "Motoko value tracker for prometheus"
repository = "https://github.com/research-ag/promtracker"
keywords = [ "prometheus", "stats", "http", "metrics", "monitoring" ]
license = "Apache-2.0"
files = [ "src/**/*.mo", "examples/**/*.{mo,toml,md}" ]

[dependencies]
core = "2.6.2"

[dev-dependencies]
matchers = "2.1.0"

[requirements]
moc = "1.4.0"

[toolchain]
moc = "2.0.0"
pocket-ic = "15.0.0"
